# PMD violations excluded from build failure
#
# These rules produce excessive false positives in XML-generation code (TibcoXmlGenerator,
# DeploymentConfigGenerator) where repetitive string literal building is intentional,
# and in test stubs where unused parameters are required by an interface.
#
# Format: <rule>:<message-contains>

# Micro-optimisations that add no value in single-threaded build code
com.tibco.bw.maven.plugin.descriptor.TibcoXmlGenerator=ConsecutiveAppendsShouldReuse
com.tibco.bw.maven.plugin.descriptor.TibcoXmlGenerator=ConsecutiveLiteralAppends
com.tibco.bw.maven.plugin.descriptor.TibcoXmlGenerator=AppendCharacterWithChar
com.tibco.bw.maven.plugin.descriptor.TibcoXmlGenerator=AvoidDuplicateLiterals
com.tibco.bw.maven.plugin.descriptor.TibcoXmlGenerator=InsufficientStringBufferDeclaration
com.tibco.bw.maven.plugin.descriptor.DeploymentConfigGenerator=ConsecutiveAppendsShouldReuse
com.tibco.bw.maven.plugin.descriptor.DeploymentConfigGenerator=ConsecutiveLiteralAppends
com.tibco.bw.maven.plugin.descriptor.DeploymentConfigGenerator=AppendCharacterWithChar
com.tibco.bw.maven.plugin.descriptor.DeploymentConfigGenerator=AvoidDuplicateLiterals
com.tibco.bw.maven.plugin.descriptor.DeploymentConfigGenerator=InsufficientStringBufferDeclaration
com.tibco.bw.maven.plugin.descriptor.DeploymentConfigGenerator=AvoidInstantiatingObjectsInLoops
com.tibco.bw.maven.plugin.descriptor.SubstVarWriter=ConsecutiveAppendsShouldReuse
com.tibco.bw.maven.plugin.descriptor.SubstVarWriter=ConsecutiveLiteralAppends
com.tibco.bw.maven.plugin.descriptor.SubstVarWriter=AvoidInstantiatingObjectsInLoops

# DataflowAnomalyAnalysis produces a high number of false positives across all files
com.tibco.bw.maven.plugin.descriptor.TibcoXmlGenerator=DataflowAnomalyAnalysis
com.tibco.bw.maven.plugin.descriptor.DeploymentConfigGenerator=DataflowAnomalyAnalysis
com.tibco.bw.maven.plugin.descriptor.SubstVarParser=DataflowAnomalyAnalysis
com.tibco.bw.maven.plugin.descriptor.SubstVarWriter=DataflowAnomalyAnalysis
com.tibco.bw.maven.plugin.descriptor.PropertyMerger=DataflowAnomalyAnalysis
com.tibco.bw.maven.plugin.packaging.BwEarMojo=DataflowAnomalyAnalysis
com.tibco.bw.maven.plugin.packaging.RunBwMojo=DataflowAnomalyAnalysis
com.tibco.bw.maven.plugin.compile.ExtractJavaSourcesMojo=DataflowAnomalyAnalysis

# Test stub: UnusedFormalParameter is required by the Artifact interface
com.tibco.bw.maven.plugin.descriptor.TibcoXmlGeneratorTest=UnusedFormalParameter
