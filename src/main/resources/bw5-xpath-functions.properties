# TIBCO BW5 custom XPath functions — extracted from XPathFunctionDocumentation.xml (BW 5.16)
# Format: function-name=minArity,maxArity
# These are in no-namespace (BW5 registers them globally without a prefix)

# String
concat-sequence=1,1
concat-sequence-format=2,3
index-of=2,2
last-index-of=2,2
left=2,2
pad=2,3
pad-and-limit=2,3
pad-front=2,3
render-xml=0,0
right=2,2
substring-before-last=2,2
substring-after-last=2,2
trim=1,1
tokenize=1,2
tokenize-allow-empty=1,1

# Logical
xor=2,2

# Set
if-absent=2,2

# Number
round-fraction=2,2
string-round-fraction=2,2

# Binary
base64-to-string=1,1
base64-to-hex=1,1
base64-length=1,1
hex-to-base64=1,1
hex-to-string=1,1
hex-length=1,1
string-to-base64=1,1
string-to-hex=1,1

# Date/time
add-to-date=4,4
add-to-time=4,4
add-to-dateTime=7,7
compare-date=2,2
compare-dateTime=2,2
compare-time=2,2
create-dateTime=6,6
create-dateTime-timezone=8,8
create-date=3,3
create-time=3,3
current-dateTime-timezone=2,2
format-dateTime=2,2
format-date=2,2
format-time=2,2
get-century-from-dateTime=1,1
get-century-from-date=1,1
get-year-from-dateTime=1,1
get-year-from-date=1,1
get-month-from-dateTime=1,1
get-month-from-date=1,1
get-day-from-dateTime=1,1
get-day-from-date=1,1
get-hours-from-dateTime=1,1
get-hours-from-time=1,1
get-minutes-from-dateTime=1,1
get-minutes-from-time=1,1
get-seconds-from-dateTime=1,1
get-seconds-from-time=1,1
get-timezone-from-dateTime=1,1
get-timezone-from-date=1,1
get-timezone-from-time=1,1
parse-dateTime=2,2
parse-date=2,2
parse-time=2,2
translate-timezone=2,2
timestamp=0,0
validate-dateTime=2,2

# XPath 2.0 functions supported by BW5 via Saxon — accepted to avoid false positives
trace=2,2
root=1,1
